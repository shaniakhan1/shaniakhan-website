<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #0A0A0A;
            display: flex;
            flex-direction: column;
            font-family: 'DM Sans', sans-serif;
        }
        .top-bar { height: 4px; background: #C9A84C; width: 100%; flex-shrink: 0; }
        .body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 160px 80px;
            text-align: center;
        }
        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #C9A84C;
            margin-bottom: 40px;
        }
        .permission-line {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 900;
            color: #F5F0E8;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .permission-sub {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 400;
            font-style: italic;
            color: #F5F0E8;
            opacity: 0.45;
            margin-bottom: 48px;
        }
        .divider {
            width: 60px;
            height: 2px;
            background: #C9A84C;
            margin-bottom: 40px;
        }
        .four-lines {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 52px;
        }
        .four-line {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 400;
            font-style: italic;
            color: #C9A84C;
            line-height: 1.4;
        }
        .closing-line {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 900;
            color: #F5F0E8;
            line-height: 1.1;
        }
        .brand-footer {
            position: absolute;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #F5F0E8;
            opacity: 0.12;
        }
    </style>
</head>
<body>
<div class="slide-container" style="position:relative;">
    <div class="top-bar"></div>
    <div class="body">
        <div class="eyebrow">Soft Power Mastermind · July 21, 2026</div>
        <div class="permission-line">You do not need permission.</div>
        <div class="permission-sub">You never did.</div>
        <div class="divider"></div>
        <div class="four-lines">
            <div class="four-line">The robe is yours.</div>
            <div class="four-line">The pause is yours.</div>
            <div class="four-line">The price is yours.</div>
            <div class="four-line">The room is yours.</div>
        </div>
        <div class="closing-line">Go be the woman you already are.</div>
    </div>
    <div class="brand-footer">Shania Khan · shaniakhan.com</div>
</div>
</body>
</html>
