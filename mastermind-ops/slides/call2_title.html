<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #0A0A0A;
            display: flex;
            flex-direction: column;
            font-family: 'DM Sans', sans-serif;
            position: relative;
        }
        .top-bar {
            height: 6px;
            background: #C9A84C;
            width: 100%;
            flex-shrink: 0;
        }
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 100px;
        }
        .left-content {
            flex: 1;
        }
        .call-label {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #C9A84C;
            margin-bottom: 28px;
        }
        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 80px;
            font-weight: 900;
            color: #F5F0E8;
            line-height: 1.0;
            margin-bottom: 36px;
        }
        .main-title em {
            font-style: italic;
            color: #C9A84C;
        }
        .divider {
            width: 80px;
            height: 2px;
            background: #C9A84C;
            margin-bottom: 28px;
        }
        .subtitle {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 300;
            color: #F5F0E8;
            opacity: 0.65;
            line-height: 1.7;
            max-width: 560px;
        }
        .right-content {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 20px;
        }
        .big-number {
            font-family: 'Playfair Display', serif;
            font-size: 200px;
            font-weight: 900;
            color: #C9A84C;
            opacity: 0.07;
            line-height: 1;
            text-align: right;
        }
        .bottom-row {
            position: absolute;
            bottom: 48px;
            right: 100px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            color: #F5F0E8;
            opacity: 0.35;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .week-badge {
            background: #C9A84C;
            color: #0A0A0A;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 14px;
        }
    </style>
</head>
<body>
<div class="slide-container">
    <div class="top-bar"></div>
    <div class="content">
        <div class="left-content">
            <div class="call-label">Soft Power Mastermind · Call Two</div>
            <div class="main-title">The <em>Internal</em><br>Update</div>
            <div class="divider"></div>
            <div class="subtitle">The story running in your head about money and worth is not the truth. It is a file. Files can be updated.</div>
        </div>
        <div class="right-content">
            <div class="big-number">2</div>
        </div>
    </div>
    <div class="bottom-row">
        <div class="brand">Shania Khan</div>
        <div class="week-badge">July 7</div>
    </div>
</div>
</body>
</html>
