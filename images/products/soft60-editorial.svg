<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbf7ef"/><stop offset="1" stop-color="#f3dfad"/>
  </linearGradient>
  <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbfbf8"/><stop offset=".52" stop-color="#f6eac8"/><stop offset="1" stop-color="#efc987"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2b2118" flood-opacity=".15"/></filter>
</defs>
<rect width="1120" height="1400" fill="url(#bg)"/>
<text x="560" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="58" fill="#6f5236">A softer way to change</text>
<text x="560" y="175" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#876e58">93 pages · 60 days · gentle structure</text>

<g filter="url(#shadow)">
  <rect x="115" y="300" width="440" height="680" rx="6" fill="url(#cover)"/>
  <text x="335" y="505" text-anchor="middle" font-family="Georgia,serif" font-size="51" fill="#684c34">SOFT60</text>
  <text x="335" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="51" fill="#684c34">METHOD™</text>
  <text x="335" y="635" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#765d49">60 Days to reset your</text>
  <text x="335" y="668" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#765d49">nervous system, rewire your</text>
  <text x="335" y="701" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#765d49">identity, and prove gentle works.</text>
</g>

<g filter="url(#shadow)">
  <rect x="540" y="475" width="425" height="520" rx="4" fill="#fffdfa" stroke="#ded4c8"/>
  <text x="752" y="550" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#4e4034">Soft Space</text>
  <text x="752" y="593" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#735f4c">An open page for whatever needs to land here.</text>
  <g stroke="#d9cfbf">
    <line x1="588" y1="675" x2="916" y2="675"/>
    <line x1="588" y1="735" x2="916" y2="735"/>
    <line x1="588" y1="795" x2="916" y2="795"/>
    <line x1="588" y1="855" x2="916" y2="855"/>
  </g>
</g>

<rect x="220" y="1060" width="680" height="220" fill="#fffdfa" stroke="#dfd4c4"/>
<text x="560" y="1150" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#6f5236">Gentle was the way all along.</text>
<text x="560" y="1210" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#8a725b">Soft60 Method™</text>
</svg>