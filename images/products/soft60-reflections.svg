<g font-family="Georgia,serif" font-size="22" fill="#4e4034"><text x="145" y="435">1. Regulation Check</text><text x="145" y="520">2. Chaos Subtracted</text><text x="145" y="605">3. Gentle Movement</text><text x="145" y="690">4. Eating With Presence</text><text x="145" y="775">5. Identity Proof</text><text x="145" y="860">6. Reflection</text></g>
