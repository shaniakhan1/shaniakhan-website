<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    // GitHub Pages 404 redirect fix for React subfolders
    // If the path starts with /mastermind, load the mastermind app
    var path = window.location.pathname;
    if (path === '/mastermind' || path.indexOf('/mastermind/') === 0) {
      // Store the intended path so the React app can restore it if needed
      sessionStorage.setItem('ghpages_redirect', path);
      window.location.replace('/mastermind/');
    } else {
      // For all other 404s, redirect to the main site
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
